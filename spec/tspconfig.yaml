emit:
  - "@typra/emitter"
options:
  "@typra/emitter":
    # Compiled from within spec/ ; runtimes live one level up.
    emitter-output-dir: "{cwd}/../runtimes/python"
    root-object: "Quilldown.Samples"
    root-namespace: "Quilldown"
    deterministic-output: true
    emit-targets:
      - type: Python
        output-dir: "../runtimes/python/src/quilldown_spec"
        test-dir: "../runtimes/python/tests"
        import-path: "quilldown_spec"
        vector-adapter-path: "vector_adapters"
        format: false
      - type: Rust
        output-dir: "../runtimes/rust/quilldown/src/typra_spec"
        test-dir: "../runtimes/rust/quilldown/tests"
        import-path: "quilldown::typra_spec"
        vector-adapter-path: "vector_adapters"
        native-serialization: "serde"
        format: true
