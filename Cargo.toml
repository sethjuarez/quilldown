# quilldown — Markdown -> DOCX (high fidelity)
# Cargo workspace: a reusable library crate plus a thin CLI.
[workspace]
resolver = "2"
members = ["crates/quilldown", "crates/quilldown-cli"]

[workspace.package]
version = "1.0.0" # x-release-please-version
edition = "2021"
license = "MIT"
repository = "https://github.com/sethjuarez/quilldown"
authors = ["Seth Juarez"]
rust-version = "1.74"

[workspace.dependencies]
# Core conversion deps, shared across crates and pinned to recent stable releases.
comrak = "0.54"
docx-rs = "0.4.22"
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
# Pure-Rust SVG rasterization (no native/system deps) for embedding diagrams.
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Syntax highlighting for fenced code blocks. Matches comrak's onig regex backend so the
# already-compiled syntect build is reused (no second regex engine, no new native dep).
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
# Pure-Rust LaTeX -> MathML conversion, the first stage of native Word equation (OMML)
# rendering. No native deps, WASM-safe, and keeps the workspace MSRV.
latex2mathml = "0.2"
# Read-only pure-Rust XML parser used to walk latex2mathml's MathML and emit OMML.
roxmltree = "0.20"
# Decoding `data:` image URLs (always available; deterministic, no network).
base64 = "0.22"
# Serializable IR shapes (portable document IR). Derive-only; keeps the IR a plain
# data contract that can later back a TypeSpec/typra model surface.
serde = { version = "1", features = ["derive"] }
# Opt-in pure-Rust HTTP client for fetching remote images. Only compiled when the
# `remote-images` feature is enabled, so the default build stays lean and reproducible.
ureq = "2"
