[package]
name = "quilldown"
description = "Convert GitHub-Flavored Markdown into high-fidelity Word .docx documents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage = "https://github.com/sethjuarez/quilldown"
documentation = "https://docs.rs/quilldown"
keywords = ["markdown", "docx", "word", "ooxml", "gfm"]
categories = ["text-processing"]

[dependencies]
comrak.workspace = true
docx-rs.workspace = true
thiserror.workspace = true
latex2mathml.workspace = true
roxmltree.workspace = true
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true
image.workspace = true
syntect.workspace = true
base64.workspace = true
ureq = { workspace = true, optional = true }
zip = "2"

[features]
# Opt-in fetching of remote (http/https) images. Off by default so the standard build
# pulls no TLS stack and conversions stay reproducible; `data:` URLs work without it.
remote-images = ["dep:ureq"]

[dev-dependencies]
zip = "2"
tempfile = "3"
image.workspace = true
