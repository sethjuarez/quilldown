[package]
name = "quilldown-cli"
description = "Command-line interface for quilldown: Markdown -> Word .docx."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage = "https://github.com/sethjuarez/quilldown"
keywords = ["markdown", "docx", "word", "cli", "converter"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "quilldown"
path = "src/main.rs"

[dependencies]
quilldown = { path = "../quilldown", version = "0.2.0" } # x-release-please-version
clap.workspace = true
anyhow.workspace = true

[features]
# Forward to the library so `quilldown-cli --features remote-images` enables network image fetch.
remote-images = ["quilldown/remote-images"]
