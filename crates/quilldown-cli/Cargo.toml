[package]
name = "quilldown-cli"
description = "Command-line interface for quilldown: Markdown -> Word .docx."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "quilldown"
path = "src/main.rs"

[dependencies]
quilldown = { path = "../quilldown" }
clap.workspace = true
anyhow.workspace = true

[features]
# Forward to the library so `quilldown-cli --features remote-images` enables network image fetch.
remote-images = ["quilldown/remote-images"]
# Forward to the library so `quilldown-cli --features math-render` typesets `$...$` math to images.
math-render = ["quilldown/math-render"]
