name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, tests, and lints. The skill-sync tests in quilldown-cli live
  # here too, so a flag/API change that forgets to update the quilldown skill
  # (.github/skills/quilldown/SKILL.md) fails this job and blocks the PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets
