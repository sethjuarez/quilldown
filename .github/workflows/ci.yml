name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, tests, and lints. The skill-sync tests in quilldown-cli live
  # here too, so a flag/API change that forgets to update the quilldown skill
  # (.github/skills/quilldown/SKILL.md) fails this job and blocks the PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: generate TypeSpec vector corpus
        working-directory: spec
        run: |
          npm ci
          npm run generate
      - name: rustfmt
        run: cargo fmt --all --check
      - name: test
        run: cargo test --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: locked MSRV check
        run: cargo check --locked -p quilldown --lib

  # Python runtime conformance. Runs the typra-generated shape tests plus the
  # hand-authored lower/emit vectors against the shared contract, keeping the
  # Python runtime honest to the same spec the Rust runtime is frozen against.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: generate TypeSpec outputs
        working-directory: spec
        run: |
          npm ci
          npm run generate
      - name: verify generated outputs are current
        run: git diff --exit-code -- runtimes/python spec
      - name: conformance (pytest)
        working-directory: runtimes/python
        run: uv run pytest -q
      - name: build and smoke-test wheel
        working-directory: runtimes/python
        run: |
          uv build --out-dir dist
          uv venv .venv-wheel-test
          uv pip install --python .venv-wheel-test/bin/python dist/*.whl "python-docx>=1.1"
          .venv-wheel-test/bin/python -c "import io, quilldown; d=quilldown.lower('# Hi\n'); out=io.BytesIO(); quilldown.render_docx(d.save()).save(out); assert len(out.getvalue()) > 0"

  # L2 document parity: render each Markdown input with BOTH the Rust reference
  # CLI (the golden source) and the Python runtime, normalize both with the one
  # shared normalizer, and assert the Word-level views match. Needs the Rust CLI
  # at test time, so this job builds it and points the harness at the binary.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: build quilldown CLI (parity oracle)
        run: cargo build --release -p quilldown-cli
      - name: document parity (pytest)
        working-directory: runtimes/python
        env:
          QUILLDOWN_CLI: ${{ github.workspace }}/target/release/quilldown
        run: uv run pytest tests/test_doc_parity.py -q
