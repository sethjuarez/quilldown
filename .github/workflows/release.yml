name: release

on:
  push:
    branches: [main]

# Only one release pipeline at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Maintain the release PR (version bump + CHANGELOG). When that PR is
  #    merged, this creates the GitHub Release + tag and sets release_created.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. Publish the library, then the CLI, to crates.io.
  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish quilldown (library) then quilldown-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # cargo waits for each crate to appear in the index before returning,
          # so the dependent CLI publish resolves the freshly published library.
          cargo publish -p quilldown
          cargo publish -p quilldown-cli

  # 3. Build cross-platform binaries and attach them to the GitHub Release.
  upload-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p quilldown-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="quilldown-${TAG}-${TARGET}"
          mkdir "$stage"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${TARGET}/release/quilldown.exe" "$stage/"
          else
            cp "target/${TARGET}/release/quilldown" "$stage/"
          fi
          cp README.md LICENSE "$stage/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${stage}.zip" "$stage" >/dev/null
            asset="${stage}.zip"
          else
            tar czf "${stage}.tar.gz" "$stage"
            asset="${stage}.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber
