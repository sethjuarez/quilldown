name: release

on:
  push:
    branches: [main]

# Only one release pipeline at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Maintain one release PR PER RUNTIME (separate-pull-requests), each scoped
  #    to its own runtime folder so a runtime's changelog only reflects commits
  #    that touch its directory. The Rust runtime lives at runtimes/rust
  #    (component `quilldown`, `quilldown-v<x>` tags); the Python runtime at
  #    runtimes/python (component `quilldown-python`, `quilldown-python-v<x>`
  #    tags). Both are non-root packages, so release-please emits
  #    `<path>--`-prefixed outputs. Merging a runtime's release PR creates that
  #    runtime's GitHub Release + tag and flips its own release_created flag.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      rust_release_created: ${{ steps.release.outputs['runtimes/rust--release_created'] }}
      rust_tag_name: ${{ steps.release.outputs['runtimes/rust--tag_name'] }}
      python_release_created: ${{ steps.release.outputs['runtimes/python--release_created'] }}
      python_tag_name: ${{ steps.release.outputs['runtimes/python--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. Rust runtime: publish the library, then the CLI, to crates.io.
  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.rust_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.rust_tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish quilldown (library) then quilldown-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # cargo waits for each crate to appear in the index before returning,
          # so the dependent CLI publish resolves the freshly published library.
          cargo publish -p quilldown
          cargo publish -p quilldown-cli

  # 3. Rust runtime: build cross-platform binaries and attach them to the Rust
  #    GitHub Release.
  upload-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.rust_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.rust_tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p quilldown-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.rust_tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="quilldown-${TAG}-${TARGET}"
          mkdir "$stage"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${TARGET}/release/quilldown.exe" "$stage/"
          else
            cp "target/${TARGET}/release/quilldown" "$stage/"
          fi
          cp README.md LICENSE "$stage/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${stage}.zip" "$stage" >/dev/null
            asset="${stage}.zip"
          else
            tar czf "${stage}.tar.gz" "$stage"
            asset="${stage}.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber

  # 4. Python runtime: build the sdist + wheel, attach them to the Python GitHub
  #    Release, then publish to PyPI via OIDC trusted publishing (no API token).
  #    Prerequisites (configured once, outside this repo):
  #      - a PyPI trusted publisher for project `quilldown` pointing at this
  #        repo + workflow `release.yml` + environment `pypi` (use a *pending*
  #        publisher for the first, project-creating release);
  #      - a GitHub environment named `pypi`.
  #    Job-level `permissions` REPLACE the workflow-level block, so `contents:
  #    write` is re-declared here for the `gh release upload` step alongside the
  #    `id-token: write` that trusted publishing requires.
  publish-python:
    needs: release-please
    if: ${{ needs.release-please.outputs.python_release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.python_tag_name }}
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        working-directory: runtimes/python
        run: uv build --out-dir dist
      - name: Upload to the Python GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.python_tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" runtimes/python/dist/*.whl runtimes/python/dist/*.tar.gz --clobber
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: runtimes/python/dist
